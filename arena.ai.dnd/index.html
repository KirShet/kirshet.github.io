<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Арена D&D</title>
<style>
:root{--bg:#efe9dc;--pn:#fbf8f1;--tx:#2a2620;--bd:#d3c9b3;--ac:#a5381f;--acx:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15120e;--pn:#241f18;--tx:#eee6d6;--bd:#40382b;--ac:#d9633f;--acx:#1a1510}}
:root[data-theme="dark"]{--bg:#15120e;--pn:#241f18;--tx:#eee6d6;--bd:#40382b;--ac:#d9633f;--acx:#1a1510}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:14px/1.3 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;overflow:hidden}
.bar{display:flex;flex-wrap:wrap;gap:6px;padding:8px;background:var(--pn);border-bottom:1px solid var(--bd);align-items:center}
.bar[hidden]{display:none}
button,input{font:inherit;color:var(--tx)}
button{background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:6px 10px;cursor:pointer}
button.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.sw{width:30px;height:30px;padding:0;border-radius:8px;border:2px solid var(--bd)}
.sw.on{border-color:var(--ac);outline:2px solid var(--ac)}
input[type=text]{background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:6px 8px;width:110px}
input[type=color]{width:34px;height:32px;padding:0;border:1px solid var(--bd);border-radius:8px;background:none}
label{display:flex;align-items:center;gap:6px;font-size:12px;opacity:.9}
input[type=range]{width:100px}
.sp{flex:1}
#wrap{flex:1;position:relative;min-height:0}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#hint{position:absolute;left:8px;bottom:8px;right:8px;font-size:12px;opacity:.8;pointer-events:none;background:var(--pn);padding:4px 8px;border-radius:6px;width:fit-content;max-width:calc(100% - 16px)}
</style>
</head>
<body>
<div class="bar" id="tools"></div>
<div class="bar" id="fpb" hidden>
  <label>Поле зрения <input type="range" id="fpf" min="40" max="120" value="69"><span id="fpfv">69°</span></label>
  <label>Наклон камеры <input type="range" id="fpp" min="-40" max="40" value="0"><span id="fppv">0°</span></label>
  <button id="fpr">Сбросить</button>
</div>
<div class="bar" id="pal"></div>
<div class="bar" id="abl" hidden>
  <span style="font-size:12px;opacity:.8">Стихия:</span><span id="abE" style="display:flex;gap:6px;flex-wrap:wrap"></span>
  <span style="font-size:12px;opacity:.8">Удар:</span><span id="abS" style="display:flex;gap:6px;flex-wrap:wrap"></span>
  <label>Макс. размер <input type="range" id="abZ" min="1" max="12" value="8"><span id="abV">8 кл. (40 фт)</span></label>
</div>
<div class="bar">
  <label>Поворот <input type="range" id="rot" min="0" max="360" value="35"></label>
  <button id="rl">⟲ 90°</button><button id="rr">⟳ 90°</button>
  <label>Наклон <input type="range" id="tilt" min="25" max="85" value="55"></label>
  <button id="ctr">⌖ Центр</button>
  <button id="cmF" title="Камера вперёд (W)">▲ Вперёд</button><button id="cmB" title="Камера назад (S)">▼ Назад</button><button id="cmL" title="Влево (A)">◀</button><button id="cmR" title="Вправо (D)">▶</button>
  <button id="vis" class="on" title="Свет и зрение персонажей">👁 Зрение</button><label>Радиус <input type="range" id="vr" min="3" max="20" value="20"></label>
  <button id="rul" title="Расстояние от выбранного персонажа">📏 Линейка</button>
  <button id="fbtn" title="Вид глазами выбранного персонажа">🎥 Вид от 1-го лица</button>
  <button id="abtn" title="Магическая способность выбранного персонажа">✨ Способность</button>
  <label>Свет <input type="color" id="vc" value="#ffcf8a" title="Цвет зрения выбранного персонажа"></label>
  
  <span class="sp"></span>
  <input type="text" id="nm" placeholder="Имя" maxlength="12">
  <input type="color" id="cl" value="#3b7dd8">
  <button id="addc">+ Персонаж</button>
  <button id="img">🖼 Картинка</button>
  <button id="noimg" title="Убрать картинку">✕</button>
  <input type="file" id="fi" accept="image/*" hidden>
  <button id="clr">Сброс</button>
</div>
<div id="wrap"><canvas id="cv"></canvas>
<div id="hint">Нажмите «+» у края арены, чтобы достроить область · правая кнопка/Shift — вращать · Alt/колёсико мыши — сдвиг · колесо — масштаб · W/S — камера вперёд/назад, A/D — вбок · Q/E — 90° · линейка: зажмите персонажа или правая кнопка по нему (Esc — выкл.)</div></div>
<script>
const C=8, cv=document.getElementById('cv'), g=cv.getContext('2d'), hint=document.getElementById('hint');
const HINT=hint.textContent;
const TER={
 grass:{n:'Трава',c:[96,150,62],d:[70,118,46],t:'dots'},
 tall:{n:'Высокая трава',c:[66,118,48],d:[44,92,34],t:'blades'},
 field:{n:'Поле (пшеница)',c:[205,176,84],d:[170,140,56],t:'rows'},
 plow:{n:'Пашня',c:[120,84,52],d:[88,58,34],t:'rows'},
 dirt:{n:'Земля',c:[138,104,70],d:[108,78,50],t:'dots'},
 sand:{n:'Песок',c:[222,200,142],d:[196,170,110],t:'dots'},
 stone:{n:'Камень',c:[134,134,138],d:[100,100,106],t:'tiles'},
 wood:{n:'Дерево',c:[160,112,66],d:[120,82,46],t:'planks'},
 water:{n:'Вода',c:[58,112,176],d:[110,168,220],t:'waves'},
 snow:{n:'Снег',c:[236,242,248],d:[184,200,220],t:'dots'},
 lava:{n:'Лава',c:[196,60,24],d:[255,170,40],t:'waves'},
 puddle:{n:'Лужа',c:[104,160,214],d:[176,210,242],t:'waves'},
 burnt:{n:'Выжженная земля',c:[54,44,40],d:[26,20,18],t:'dots'},
 flowers:{n:'Цветущие цветы',c:[104,160,70],d:[255,120,170],t:'flowers'}
};
const COMP={grass:['tall','field','dirt','sand','water','stone'],tall:['grass','dirt','water'],field:['grass','plow','dirt'],plow:['field','dirt'],dirt:['grass','sand','stone','plow','wood'],sand:['dirt','water','grass','stone'],stone:['dirt','snow','wood','lava','grass'],wood:['stone','dirt','grass'],water:['sand','grass','tall'],snow:['stone','grass','water'],lava:['stone','dirt'],puddle:['water','grass','dirt','sand'],burnt:['dirt','stone','grass','sand'],flowers:['grass','tall','field']};
const TOOLS=[['move','✋ Двигать'],['cam','🧭 Камера'],['wall','Стена'],['column','Колонна'],['chest','Сундук'],['door','Дверь'],['ewall','Земл. стена'],['tree','Дерево'],['rock','Камень'],['barrel','Бочка'],['erase','Ластик']];
const PLACE=['wall','ewall','column','chest','door','tree','rock','barrel'];
let tool='move', terr=null, ang=35*Math.PI/180, tilt=55*Math.PI/180, zoom=1;
let ter={}, objs={}, chars=[], chunks=new Set(), imgs={}, sel=null, hover=null, hoverPlus=null;
let W=0,H=0,S=30,sn=0,cs=1,T=1,Hc=0,ox=8,oy=8,ext=32,panX=0,panY=0;
const ck=(x,y)=>x+','+y, rnd=Math.random, pick=a=>a[rnd()*a.length|0];

// ---------- UI ----------
const tb=document.getElementById('tools'), pal=document.getElementById('pal');
TOOLS.forEach(([k,n])=>{const b=document.createElement('button');b.textContent=n;b.dataset.k=k;b.onclick=()=>{tool=k;terr=null;ui()};tb.appendChild(b)});
const lab=document.createElement('span');lab.textContent='Почва:';lab.style.cssText='font-size:12px;opacity:.8';pal.appendChild(lab);
Object.keys(TER).forEach(k=>{const b=document.createElement('button');b.className='sw';b.title=TER[k].n;b.dataset.k=k;b.style.background=`rgb(${TER[k].c})`;b.onclick=()=>{tool='paint';terr=k;ui()};pal.appendChild(b)});
function ui(){
 tb.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.k===tool));
 pal.querySelectorAll('.sw').forEach(b=>b.classList.toggle('on',tool==='paint'&&b.dataset.k===terr));

}
function flash(m){hint.textContent=m;clearTimeout(flash.t);flash.t=setTimeout(()=>hint.textContent=HINT,3500)}
const rot=document.getElementById('rot'), tl=document.getElementById('tilt');
rot.oninput=()=>{ang=rot.value*Math.PI/180;draw()};
tl.oninput=()=>{tilt=tl.value*Math.PI/180;draw()};
function setAng(a){a=((a%(2*Math.PI))+2*Math.PI)%(2*Math.PI);ang=a;rot.value=Math.round(a*180/Math.PI);draw()}
document.getElementById('rl').onclick=()=>setAng(ang-Math.PI/2);
document.getElementById('rr').onclick=()=>setAng(ang+Math.PI/2);
document.getElementById('ctr').onclick=()=>{fit();zoom=1;draw()};
let vision=true,vr=20,ruler=null,lp=null;
const DEFVC='#ffcf8a',hexRgb=h=>h.match(/\w\w/g).map(v=>parseInt(v,16));
const OPQ={wall:1,column:1,tree:1,rock:1,door:1};
document.getElementById('vis').onclick=e=>{vision=!vision;e.currentTarget.classList.toggle('on',vision);draw()};
document.getElementById('vr').oninput=e=>{vr=+e.target.value;draw()};

// ---------- способности ----------
const ELS={water:['💧','Вода','59,130,246'],fire:['🔥','Огонь','255,106,26'],nature:['🌿','Растения','76,217,100'],earth:['🪨','Земля','160,112,64']};
const SHS={cone:'Конус',sqS:'Квадрат (сбоку)',sqC:'Квадрат (в центре)',ciS:'Круг (сбоку)',ciC:'Круг (в центре)'};
let ab=null,abEl='fire',abSh='cone',abSize=8,abS=3;
const abBar=document.getElementById('abl');
function abUi(){
 abBar.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.e===abEl||b.dataset.s===abSh));
 document.getElementById('abV').textContent=abSize+' кл. ('+abSize*5+' фт)';
 document.getElementById('abtn').classList.toggle('on',!!ab);
}
Object.keys(ELS).forEach(k=>{const b=document.createElement('button');b.textContent=ELS[k][0]+' '+ELS[k][1];b.dataset.e=k;b.onclick=()=>{abEl=k;abUi();draw()};document.getElementById('abE').appendChild(b)});
Object.keys(SHS).forEach(k=>{const b=document.createElement('button');b.textContent=SHS[k];b.dataset.s=k;b.onclick=()=>{abSh=k;abUi();draw()};document.getElementById('abS').appendChild(b)});
document.getElementById('abZ').oninput=e=>{abSize=+e.target.value;abUi();draw()};
function abOff(){ab=null;abBar.hidden=true;abUi()}
document.getElementById('abtn').onclick=()=>{
 if(ab){abOff();draw();return}
 const c=chars.find(q=>q.id===sel);
 if(!c){flash('Сначала выберите персонажа (✋ и клик по нему)');return}
 if(fps)fpsOff();ruler=null;ab={id:c.id,to:[c.x,c.y],set:false};abBar.hidden=false;abUi();
 flash('Наведите — область, клик — применить; ПКМ по другому персонажу — сменить заклинателя; Esc — выход');draw();
};
function abCells(){
 const c=chars.find(q=>q.id===ab.id);if(!c)return[];
 const fx=c.x,fy=c.y,cx=fx+.5,cy=fy+.5,out=[];
 let dx=ab.to[0]-fx,dy=ab.to[1]-fy;if(!dx&&!dy)dx=1;
 const dl=Math.hypot(dx,dy),ux=dx/dl,uy=dy/dl,s=Math.min(abSize,Math.max(1,Math.round(Math.hypot(ab.to[0]-fx,ab.to[1]-fy)))),R=2*s+2;abS=s;
 const add=(x,y)=>{if(ter[ck(x,y)])out.push([x,y])};
 if(abSh==='cone'){
  for(let y=fy-R;y<=fy+R;y++)for(let x=fx-R;x<=fx+R;x++){
   const vx=x+.5-cx,vy=y+.5-cy,d=Math.hypot(vx,vy);
   if(d<.5||d>s+.5)continue;
   if((vx*ux+vy*uy)/d>=.894)add(x,y);
  }
 }else if(abSh==='sqS'){
  const hz=Math.abs(dx)>=Math.abs(dy),ax=hz?Math.sign(dx):0,ay=hz?0:Math.sign(dy),px=-ay,py=ax,p0=-Math.floor((s-1)/2);
  for(let i=1;i<=s;i++)for(let p=p0;p<p0+s;p++)add(fx+ax*i+px*p,fy+ay*i+py*p);
 }else if(abSh==='sqC'){
  const a0=-s;
  for(let j=a0;j<=s;j++)for(let i=a0;i<=s;i++)add(fx+i,fy+j);
 }else{
  const mx=abSh==='ciS'?cx+ux*s:cx,my=abSh==='ciS'?cy+uy*s:cy;
  for(let y=fy-R;y<=fy+R;y++)for(let x=fx-R;x<=fx+R;x++)if(Math.hypot(x+.5-mx,y+.5-my)<=s+.01)add(x,y);
 }
 return out;
}
function abCast(){
 for(const[x,y]of abCells()){
  const k=ck(x,y),t=ter[k];
  if(abEl==='water'){if(t==='lava')ter[k]='stone';else if(t!=='water')ter[k]='puddle'}
  else if(abEl==='fire'){if(!LIQ[t])ter[k]='burnt'}
  else if(abEl==='nature'){if(!LIQ[t])ter[k]='flowers'}
  else if(!objs[k]&&!chars.some(q=>q.x===x&&q.y===y))objs[k]={t:'ewall',r:0};
 }
 save();draw();
}
function abPress(e,c){
 if(e.pointerType==='mouse'||(ab.set&&ab.to[0]===c[0]&&ab.to[1]===c[1])){ab.to=c;abCast();ab.set=false}
 else{ab.to=c;ab.set=true}
}
function drawAb(){
 if(!ab)return;
 const rgb=ELS[abEl][2];
 abCells().forEach(([x,y])=>poly([P(x,y,.03),P(x+1,y,.03),P(x+1,y+1,.03),P(x,y+1,.03)],`rgba(${rgb},.38)`,`rgba(${rgb},.95)`));
 const c=chars.find(q=>q.id===ab.id);
 if(c){
  const p=P(c.x+.5,c.y+.5,.03),q=P(ab.to[0]+.5,ab.to[1]+.5,.03),fs=Math.max(12,S*.42)|0,txt=abS+' кл. · '+abS*5+' фт';
  g.beginPath();g.arc(p[0],p[1],S*.5,0,6.2832);g.lineWidth=2;g.strokeStyle=`rgb(${rgb})`;g.stroke();
  g.save();g.setLineDash([S*.2,S*.12]);g.beginPath();g.moveTo(p[0],p[1]);g.lineTo(q[0],q[1]);g.stroke();g.restore();
  g.font='700 '+fs+'px system-ui,sans-serif';g.textAlign='center';g.textBaseline='alphabetic';
  const w=g.measureText(txt).width+14;
  g.fillStyle='rgba(20,16,10,.92)';g.fillRect(q[0]-w/2,q[1]-S*.4-fs,w,fs+10);g.fillStyle=`rgb(${rgb})`;g.fillText(txt,q[0],q[1]-S*.4);
 }
}
// ---------- вид от первого лица ----------
let fps=null,fpc=null,fpx=null;
const FPF=[[255,120,170],[255,225,90],[250,250,250],[180,130,255]];
function primsOf(o,x,y){
 const r=o.r,h=hs(x,y)&15;
 const B=(ox,oy,w,d,z0,z1,col,ex)=>Object.assign({k:'b',w:r?d:w,d:r?w:d,ox:r?oy:ox,oy:r?ox:oy,z0,z1,col},ex);
 const C=(ox,oy,rad,z0,z1,col,ex)=>Object.assign({k:'c',r:rad,ox,oy,z0,z1,col},ex);
 switch(o.t){
  case 'wall':return[B(0,0,1,1,0,1.6,[132,126,118],{tx:(u,sd)=>((u*3+h*.1)%1<.04||(u*3.5)%1<.0)?.82:null})];
  case 'ewall':return[B(0,0,1,1,0,1.3,[112,84,56],{tx:u=>.9+.12*Math.sin(u*23+h)}),B(0,0,.9,.9,1.3,1.4,[84,112,52])];
  case 'column':{
   const mb=[206,200,188],ms=[216,210,198],fl=u=>.88+.12*Math.cos(u*6.2832*12);
   return[B(0,0,.82,.82,0,.12,mb),C(0,0,.42,.12,.24,mb),C(0,0,.3,.24,.9,ms,{tx:fl}),C(0,0,.27,.9,1.46,ms,{tx:fl}),C(0,0,.32,1.46,1.54,mb),C(0,0,.4,1.54,1.66,mb),B(0,0,.84,.84,1.66,1.8,mb)];
  }
  case 'chest':{
   const wd=[118,70,30],lid=[148,94,44],mt=[74,74,82],gd=[222,182,62];
   const sp=wid=>(u,sd)=>(((r?sd===0:sd===1))&&Math.abs(Math.abs(u-.5)*wid-.2)<.04)?mt:null;
   return[B(0,0,.64,.42,0,.3,wd,{tx:sp(.64)}),B(0,0,.66,.44,.3,.38,lid,{tx:sp(.66)}),B(0,0,.6,.4,.38,.45,lid,{tx:sp(.6)}),B(0,0,.5,.34,.45,.5,lid,{tx:sp(.5)}),
    B(0,.215,.1,.05,.2,.34,gd),B(0,.245,.04,.02,.24,.3,[40,30,22])];
  }
  case 'door':{
   const st=[130,126,118],w1=[126,80,40],w2=[110,68,34],ir=[62,62,70],gd=[222,182,62];
   return[B(0,0,.9,.4,0,.04,[118,112,104]),B(-.43,0,.14,.34,0,1.75,st),B(.43,0,.14,.34,0,1.75,st),B(0,0,1,.34,1.6,1.75,st),B(0,0,.2,.38,1.75,1.85,[150,144,136]),
    B(-.22,0,.2,.16,.04,1.59,w1),B(0,0,.2,.16,.04,1.59,w2),B(.22,0,.2,.16,.04,1.59,w1),
    B(0,0,.72,.19,.4,.47,ir),B(0,0,.72,.19,1.1,1.17,ir),B(.28,0,.08,.22,.8,.9,gd),B(-.36,0,.06,.2,1.2,1.3,ir),B(-.36,0,.06,.2,.3,.4,ir)];
  }
  case 'tree':{
   const v=.88+((h&7)/7)*.24,snow=ter[ck(x,y)]==='snow',lf=u=>.9+.14*Math.sin(u*31+h),out=[C(0,0,.17,0,.14,[96,66,36]),C(0,0,.1,.14,snow?.5:.8,[104,72,40])];
   if(snow)[[.44,.4,.72],[.36,.7,1.0],[.28,1.0,1.28],[.19,1.28,1.55],[.1,1.55,1.9]].forEach(([rr,a,b],i)=>out.push(C(0,0,rr,a,b,i===4?[238,244,250]:[44*v,96*v,70*v],{tx:lf})));
   else[{o:[0,0],L:[[.42,.55,.95],[.34,.95,1.35],[.22,1.35,1.65]],s:1},{o:[-.17,.12],L:[[.26,.85,1.2],[.18,1.2,1.45]],s:1.1},{o:[.17,-.1],L:[[.25,.8,1.15],[.17,1.15,1.4]],s:1.05},{o:[.1,.17],L:[[.22,.9,1.2]],s:1.12}].forEach(b=>b.L.forEach(([rr,a,z],i)=>{const m=v*b.s*(1+.07*i);out.push(C(b.o[0],b.o[1],rr,a,z,[58*m,122*m,52*m],{tx:lf}))}));
   return out;
  }
  case 'rock':{
   const g1=[124,122,116],g2=[140,138,132],nz=u=>.9+.16*Math.sin(u*19+h)*Math.sin(u*7+h*2);
   return[C(-.3,-.2,.1,0,.1,g2,{tx:nz}),C(.02,0,.38,0,.28,g1,{tx:nz}),C(-.06,.04,.28,.28,.5,g2,{tx:nz}),C(-.06,.04,.17,.5,.54,[96,122,70]),C(.3,.22,.14,0,.16,g1,{tx:nz})];
  }
  case 'barrel':{
   const wd=[132,86,42],hp=[70,70,78],stv=u=>.88+.12*Math.cos(u*6.2832*14);
   return[C(0,0,.26,0,.1,wd,{tx:stv}),C(0,0,.31,.1,.3,wd,{tx:stv}),C(0,0,.33,.3,.4,wd,{tx:stv}),C(0,0,.31,.4,.55,wd,{tx:stv}),C(0,0,.26,.55,.64,wd,{tx:stv}),
    C(0,0,.315,.12,.16,hp),C(0,0,.32,.24,.28,hp),C(0,0,.345,.32,.36,hp),C(0,0,.325,.44,.48,hp),C(0,0,.27,.56,.6,hp),C(0,0,.22,.64,.66,[160,108,54])];
  }
 }
 return[];
}
function rayPrim(p,px,py,rdx,rdy,ccx,ccy){
 const cx=ccx+(p.ox||0),cy=ccy+(p.oy||0);
 if(p.k==='c'){
  const ex=px-cx,ey=py-cy,a=rdx*rdx+rdy*rdy,b=2*(rdx*ex+rdy*ey),c=ex*ex+ey*ey-p.r*p.r,disc=b*b-4*a*c;
  if(disc<=0)return null;
  const sq=Math.sqrt(disc),t0=(-b-sq)/(2*a),t1=(-b+sq)/(2*a);
  if(t0<=0)return null;
  const hx=ex+rdx*t0,hy=ey+rdy*t0;
  return{t0,t1,nx:hx/p.r,ny:hy/p.r,u:Math.atan2(hy,hx)/6.2832+.5,side:0};
 }
 let tmin=-1e9,tmax=1e9,side=0,sg=1;
 const ax=[[cx-p.w/2,cx+p.w/2,px,rdx],[cy-p.d/2,cy+p.d/2,py,rdy]];
 for(let i=0;i<2;i++){

 L.sort((a,b)=>a.d-b.d).forEach(e=>e.f());
 lt=1;wm=0;
 if(ruler){
  const[fx,fy]=ruler.from,[tx,ty]=ruler.to,a=P(fx+.5,fy+.5,.05),b=P(tx+.5,ty+.5,.05),dd=Math.hypot(tx-fx,ty-fy);
  [[fx,fy,'rgba(255,211,77,.35)'],[tx,ty,'rgba(255,255,255,.3)']].forEach(([x,y,f])=>poly([P(x,y,.02),P(x+1,y,.02),P(x+1,y+1,.02),P(x,y+1,.02)],f,'#ffd34d'));
  g.save();g.setLineDash([S*.2,S*.12]);g.strokeStyle='#ffd34d';g.lineWidth=Math.max(2,S*.08);g.beginPath();g.moveTo(a[0],a[1]);g.lineTo(b[0],b[1]);g.stroke();g.restore();
  const txt=Math.round(dd*5)+' фт · '+dd.toFixed(1)+' кл.',mx=(a[0]+b[0])/2,my=(a[1]+b[1])/2-S*.3,fs=Math.max(12,S*.42)|0;
  g.font='700 '+fs+'px system-ui,sans-serif';g.textAlign='center';g.textBaseline='alphabetic';
  const w=g.measureText(txt).width+14;
  g.fillStyle='rgba(20,16,10,.92)';g.fillRect(mx-w/2,my-fs-2,w,fs+10);g.fillStyle='#ffd34d';g.fillText(txt,mx,my+2);
 }
 drawAb();
 steam.forEach(p=>{if(LM&&!LM[ck(Math.floor(p.x),Math.floor(p.y))])return;const t=p.a/p.m,q=P(p.x,p.y,p.z);g.beginPath();g.arc(q[0],q[1],S*(p.r+0.28*t),0,6.2832);g.fillStyle=`rgba(238,242,247,${(0.4*(1-t)).toFixed(3)})`;g.fill()});
 plusList().forEach(([cx,cy])=>{
  const hv=hoverPlus&&hoverPlus[0]===cx&&hoverPlus[1]===cy;
  poly([P(cx*C,cy*C,0),P(cx*C+C,cy*C,0),P(cx*C+C,cy*C+C,0),P(cx*C,cy*C+C,0)],hv?'rgba(255,255,255,.16)':'rgba(255,255,255,.06)','rgba(255,255,255,.35)');
  const p=P(cx*C+C/2,cy*C+C/2,0),r=S*0.7;
  g.beginPath();g.arc(p[0],p[1],r,0,6.2832);g.fillStyle=hv?'#e0583a':'rgba(30,26,20,.85)';g.fill();g.lineWidth=2;g.strokeStyle='#fff';g.stroke();
  g.beginPath();g.moveTo(p[0]-r*.5,p[1]);g.lineTo(p[0]+r*.5,p[1]);g.moveTo(p[0],p[1]-r*.5);g.lineTo(p[0],p[1]+r*.5);g.lineWidth=Math.max(2,S*0.12);g.stroke();
  drawChk(cx,cy);
 });
}

// ---------- interaction ----------
let drag=null,last=null;
function cellAt(e){
 const r=cv.getBoundingClientRect(),[gx,gy]=unP(e.clientX-r.left,e.clientY-r.top),x=Math.floor(gx),y=Math.floor(gy);
 return chunks.has(ck(Math.floor(x/C),Math.floor(y/C)))?[x,y]:null;
}
function plusAt(e){
 const r=cv.getBoundingClientRect(),X=e.clientX-r.left,Y=e.clientY-r.top;
 return plusList().find(([cx,cy])=>{const p=P(cx*C+C/2,cy*C+C/2,0);return Math.hypot(p[0]-X,p[1]-Y)<S*0.8})||null;
}
function apply(x,y){
 const k=ck(x,y);
 if(tool==='paint'&&terr)ter[k]=terr;
 else if(PLACE.includes(tool)){
  const o=objs[k];if(o&&o.t===tool&&drag.fresh)o.r=o.r?0:1;else if(!o||o.t!==tool)objs[k]={t:tool,r:0};
 }else if(tool==='erase'){
  if(objs[k])delete objs[k];else chars=chars.filter(c=>!(c.x===x&&c.y===y));
 }
}
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('pointerdown',e=>{
 cv.setPointerCapture(e.pointerId);
 if(fps){drag={mode:'look',x:e.clientX,y:e.clientY,a:fps.yaw,p:fps.pitch||0};return}
 if(e.button===1||e.altKey){drag={mode:'pan',x:e.clientX,y:e.clientY,px:panX,py:panY};e.preventDefault();return}
 if(e.button===2){
  const c0=cellAt(e),ch0=c0&&chars.find(q=>q.x===c0[0]&&q.y===c0[1]);
  if(ch0){if(ab){ab.id=ch0.id;ab.to=[ch0.x,ch0.y];sel=ch0.id}else ruler={from:[ch0.x,ch0.y],to:[ch0.x,ch0.y]};drag=null;draw();return}
 }
 if(e.button===2||e.shiftKey||tool==='cam'){drag={mode:'rot',x:e.clientX,a:ang,moved:false,off:e.button===2&&!!ruler};return}
 const ch=chkAt(e);
 if(ch){const k=ck(ch.cx,ch.cy),o=popts[k]||(popts[k]={});o[ch.b.k]=o[ch.b.k]===false;drag=null;draw();return}
 const pl=plusAt(e);
 if(pl){gen(pl[0],pl[1],getOpts(pl));fit();save();drag=null;draw();return}
 const c=cellAt(e);if(!c){drag=null;return}
 if(ab){abPress(e,c);drag=null;draw();return}
 if(ruler){const rc=chars.find(q=>q.x===c[0]&&q.y===c[1]);if(rc)ruler.from=[rc.x,rc.y];ruler.to=c;drag={mode:'ruler'};draw();return}
 drag={mode:'tool',fresh:true,char:null};
 if(tool==='move'){
  const ch=chars.find(q=>q.x===c[0]&&q.y===c[1]);sel=ch?ch.id:null;drag.char=ch||null;
  clearTimeout(lp);
  if(ch){const k0=c.join();lp=setTimeout(()=>{if(drag&&drag.char===ch&&last===k0){ruler={from:[ch.x,ch.y],to:[ch.x,ch.y]};drag.mode='ruler';drag.char=null;draw()}},450)}
  const o=objs[ck(c[0],c[1])];if(!ch&&o&&(o.t==='door'||o.t==='chest'))o.r=o.r?0:1;
 }else apply(c[0],c[1]);
 last=c.join();drag.fresh=false;draw();
});
cv.addEventListener('pointermove',e=>{
 if(fps){if(drag&&drag.mode==='look'){fps.yaw=drag.a+(e.clientX-drag.x)*0.006;fps.pitch=Math.max(-.85,Math.min(.85,drag.p-(e.clientY-drag.y)*0.004));fpSync();draw()}return}
 if(drag&&drag.mode==='rot'){if(Math.abs(e.clientX-drag.x)>3)drag.moved=true;setAng(drag.a+(e.clientX-drag.x)*0.01);return}
 if(drag&&drag.mode==='pan'){panX=drag.px+e.clientX-drag.x;panY=drag.py+e.clientY-drag.y;draw();return}
 const chh=chkAt(e);
 if(chh){hint.textContent='☑ '+chh.b.n+' — включить/выключить для нового блока';hint.dataset.c=1}else if(hint.dataset.c){hint.textContent=HINT;delete hint.dataset.c}
 const c=cellAt(e);hover=c;hoverPlus=chh?null:plusAt(e);
 if(ruler&&c)ruler.to=c;if(ab&&c)ab.to=c;
 if(drag&&c&&c.join()!==last){
  last=c.join();
  if(tool==='move'){
   const o=objs[ck(c[0],c[1])];
   if(drag.char)clearTimeout(lp);
   if(drag.char&&(!o||o.t==='door')&&!chars.some(q=>q!==drag.char&&q.x===c[0]&&q.y===c[1])){drag.char.x=c[0];drag.char.y=c[1]}
  }else apply(c[0],c[1]);
 }
 cv.style.cursor=(hoverPlus||chh)?'pointer':'default';
 draw();
});
cv.addEventListener('pointerup',()=>{clearTimeout(lp);if(drag&&drag.mode==='tool')save();if(drag&&drag.mode==='rot'&&!drag.moved&&drag.off)ruler=null;drag=null;last=null;draw()});
cv.addEventListener('pointerleave',()=>{hover=null;hoverPlus=null;draw()});
cv.addEventListener('wheel',e=>{e.preventDefault();
 if(fps){fps.fov=Math.max(.7,Math.min(2.1,fps.fov*(e.deltaY<0?.95:1.05)));fpSync();draw();return}zoom=Math.max(0.3,Math.min(4,zoom*(e.deltaY<0?1.1:0.9)));draw()},{passive:false});
cv.addEventListener('dragover',e=>e.preventDefault());
cv.addEventListener('drop',e=>{
 e.preventDefault();const f=e.dataTransfer.files[0];if(!f||!f.type.startsWith('image/'))return;
 const c=cellAt(e),ch=c&&chars.find(q=>q.x===c[0]&&q.y===c[1])||chars.find(q=>q.id===sel);
 if(ch){sel=ch.id;loadImg(ch,f)}else flash('Бросьте картинку на персонажа');
});

// ---------- storage ----------
function save(){try{localStorage.setItem('dnd-arena2',JSON.stringify({ter,objs,chars,chunks:[...chunks]}))}catch(e){}}
function load(){
 try{const s=JSON.parse(localStorage.getItem('dnd-arena2')||'null');
  if(s&&s.chunks&&s.chunks.length){ter=s.ter;objs=s.objs||{};chars=s.chars||[];chunks=new Set(s.chunks);chars.forEach(c=>c.img&&setImg(c));fit();return}}catch(e){}
 start();
}
function resize(){const r=cv.getBoundingClientRect(),d=devicePixelRatio||1;W=r.width;H=r.height;cv.width=W*d;cv.height=H*d;draw()}
addEventListener('resize',resize);
// ---------- пар на границе лавы и воды ----------
let srcs=[],steam=[],lastT=0,frame=0;
function steamSrc(){
 const out=[];
 for(const k in ter){
  if(ter[k]!=='lava')continue;
  const[x,y]=k.split(',').map(Number);
  for(const[a,b]of[[1,0],[-1,0],[0,1],[0,-1]])if(ter[ck(x+a,y+b)]==='water')out.push([x+.5+a*.5,y+.5+b*.5]);
 }
 return out;
}
function tick(t){
 requestAnimationFrame(tick);
 if(t-lastT<40)return;lastT=t;WT=t/1000;
 if(frame++%25===0){srcs=steamSrc();hasWave=Object.values(ter).some(v=>WAV[v])}
 if(!srcs.length&&!steam.length&&!hasWave)return;
 if(steam.length<500)srcs.forEach(s=>{if(rnd()<.22)steam.push({x:s[0]+(rnd()-.5)*.5,y:s[1]+(rnd()-.5)*.5,z:.05,vx:(rnd()-.5)*.012,vy:(rnd()-.5)*.012,vz:.02+rnd()*.02,a:0,m:35+rnd()*25,r:.14+rnd()*.1})});
 steam.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.z+=p.vz;p.a++});
 steam=steam.filter(p=>p.a<p.m);
 draw();
}
requestAnimationFrame(tick);
load();ui();resize();
</script>
