<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Арена D&D</title>
<style>
:root{--bg:#efe9dc;--pn:#fbf8f1;--tx:#2a2620;--bd:#d3c9b3;--ac:#a5381f;--acx:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15120e;--pn:#241f18;--tx:#eee6d6;--bd:#40382b;--ac:#d9633f;--acx:#1a1510}}
:root[data-theme="dark"]{--bg:#15120e;--pn:#241f18;--tx:#eee6d6;--bd:#40382b;--ac:#d9633f;--acx:#1a1510}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:14px/1.3 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;overflow:hidden}
.bar{display:flex;flex-wrap:wrap;gap:6px;padding:8px;background:var(--pn);border-bottom:1px solid var(--bd);align-items:center}
button,input{font:inherit;color:var(--tx)}
button{background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:6px 10px;cursor:pointer}
button.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.sw{width:30px;height:30px;padding:0;border-radius:8px;border:2px solid var(--bd)}
.sw.on{border-color:var(--ac);outline:2px solid var(--ac)}
input[type=text]{background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:6px 8px;width:110px}
input[type=color]{width:34px;height:32px;padding:0;border:1px solid var(--bd);border-radius:8px;background:none}
label{display:flex;align-items:center;gap:6px;font-size:12px;opacity:.9}
input[type=range]{width:100px}
.sp{flex:1}
#wrap{flex:1;position:relative;min-height:0}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#hint{position:absolute;left:8px;bottom:8px;right:8px;font-size:12px;opacity:.8;pointer-events:none;background:var(--pn);padding:4px 8px;border-radius:6px;width:fit-content;max-width:calc(100% - 16px)}
</style>
</head>
<body>
<div class="bar" id="tools"></div>
<div class="bar" id="pal"></div>
<div class="bar">
  <label>Поворот <input type="range" id="rot" min="0" max="360" value="35"></label>
  <button id="rl">⟲ 90°</button><button id="rr">⟳ 90°</button>
  <label>Наклон <input type="range" id="tilt" min="25" max="85" value="55"></label>
  <button id="ctr">⌖ Центр</button>
  <button id="cmF" title="Камера вперёд (W)">▲ Вперёд</button><button id="cmB" title="Камера назад (S)">▼ Назад</button><button id="cmL" title="Влево (A)">◀</button><button id="cmR" title="Вправо (D)">▶</button>
  <button id="vis" class="on" title="Свет и зрение персонажей">👁 Зрение</button><label>Радиус <input type="range" id="vr" min="3" max="16" value="8"></label>
  <span class="sp"></span>
  <input type="text" id="nm" placeholder="Имя" maxlength="12">
  <input type="color" id="cl" value="#3b7dd8">
  <button id="addc">+ Персонаж</button>
  <button id="img">🖼 Картинка</button>
  <button id="noimg" title="Убрать картинку">✕</button>
  <input type="file" id="fi" accept="image/*" hidden>
  <button id="clr">Сброс</button>
</div>
<div id="wrap"><canvas id="cv"></canvas>
<div id="hint">Нажмите «+» у края арены, чтобы достроить область · правая кнопка/Shift — вращать · Alt/колёсико мыши — сдвиг · колесо — масштаб · W/S — камера вперёд/назад, A/D — вбок · Q/E — 90°</div></div>
<script>
const C=8, cv=document.getElementById('cv'), g=cv.getContext('2d'), hint=document.getElementById('hint');
const HINT=hint.textContent;
const TER={
 grass:{n:'Трава',c:[96,150,62],d:[70,118,46],t:'dots'},
 tall:{n:'Высокая трава',c:[66,118,48],d:[44,92,34],t:'blades'},
 field:{n:'Поле (пшеница)',c:[205,176,84],d:[170,140,56],t:'rows'},
 plow:{n:'Пашня',c:[120,84,52],d:[88,58,34],t:'rows'},
 dirt:{n:'Земля',c:[138,104,70],d:[108,78,50],t:'dots'},
 sand:{n:'Песок',c:[222,200,142],d:[196,170,110],t:'dots'},
 stone:{n:'Камень',c:[134,134,138],d:[100,100,106],t:'tiles'},
 wood:{n:'Дерево',c:[160,112,66],d:[120,82,46],t:'planks'},
 water:{n:'Вода',c:[58,112,176],d:[110,168,220],t:'waves'},
 snow:{n:'Снег',c:[236,242,248],d:[184,200,220],t:'dots'},
 lava:{n:'Лава',c:[196,60,24],d:[255,170,40],t:'waves'}
};
const COMP={grass:['tall','field','dirt','sand','water','stone'],tall:['grass','dirt','water'],field:['grass','plow','dirt'],plow:['field','dirt'],dirt:['grass','sand','stone','plow','wood'],sand:['dirt','water','grass','stone'],stone:['dirt','snow','wood','lava','grass'],wood:['stone','dirt','grass'],water:['sand','grass','tall'],snow:['stone','grass','water'],lava:['stone','dirt']};
const TOOLS=[['move','✋ Двигать'],['cam','🧭 Камера'],['wall','Стена'],['column','Колонна'],['chest','Сундук'],['door','Дверь'],['tree','Дерево'],['rock','Камень'],['barrel','Бочка'],['erase','Ластик']];
const PLACE=['wall','column','chest','door','tree','rock','barrel'];
let tool='move', terr=null, ang=35*Math.PI/180, tilt=55*Math.PI/180, zoom=1;
let ter={}, objs={}, chars=[], chunks=new Set(), imgs={}, sel=null, hover=null, hoverPlus=null;
let W=0,H=0,S=30,sn=0,cs=1,T=1,Hc=0,ox=8,oy=8,ext=32,panX=0,panY=0;
const ck=(x,y)=>x+','+y, rnd=Math.random, pick=a=>a[rnd()*a.length|0];

// ---------- UI ----------
const tb=document.getElementById('tools'), pal=document.getElementById('pal');
TOOLS.forEach(([k,n])=>{const b=document.createElement('button');b.textContent=n;b.dataset.k=k;b.onclick=()=>{tool=k;terr=null;ui()};tb.appendChild(b)});
const lab=document.createElement('span');lab.textContent='Почва:';lab.style.cssText='font-size:12px;opacity:.8';pal.appendChild(lab);
Object.keys(TER).forEach(k=>{const b=document.createElement('button');b.className='sw';b.title=TER[k].n;b.dataset.k=k;b.style.background=`rgb(${TER[k].c})`;b.onclick=()=>{tool='paint';terr=k;ui()};pal.appendChild(b)});
function ui(){
 tb.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.k===tool));
 pal.querySelectorAll('.sw').forEach(b=>b.classList.toggle('on',tool==='paint'&&b.dataset.k===terr));
 draw();
}
function flash(m){hint.textContent=m;clearTimeout(flash.t);flash.t=setTimeout(()=>hint.textContent=HINT,3500)}
const rot=document.getElementById('rot'), tl=document.getElementById('tilt');
rot.oninput=()=>{ang=rot.value*Math.PI/180;draw()};
tl.oninput=()=>{tilt=tl.value*Math.PI/180;draw()};
function setAng(a){a=((a%(2*Math.PI))+2*Math.PI)%(2*Math.PI);ang=a;rot.value=Math.round(a*180/Math.PI);draw()}
document.getElementById('rl').onclick=()=>setAng(ang-Math.PI/2);
document.getElementById('rr').onclick=()=>setAng(ang+Math.PI/2);
document.getElementById('ctr').onclick=()=>{fit();zoom=1;draw()};
let vision=true,vr=8;
const OPQ={wall:1,column:1,tree:1,rock:1,door:1};
document.getElementById('vis').onclick=e=>{vision=!vision;e.currentTarget.classList.toggle('on',vision);draw()};
document.getElementById('vr').oninput=e=>{vr=+e.target.value;draw()};
function lightMap(){
 const m={};
 for(const c of chars){
  const sx=c.x+.5,sy=c.y+.5;
  for(let y=c.y-vr;y<=c.y+vr;y++)for(let x=c.x-vr;x<=c.x+vr;x++){
   if(!ter[ck(x,y)])continue;
   const dx=x-c.x,dy=y-c.y,d=Math.hypot(dx,dy);if(d>vr)continue;
   let ok=true;
   if(d>1.2){
    const n=Math.ceil(d*3);
    for(let s=1;s<n;s++){
     const t=s/n,cx=Math.floor(sx+dx*t),cy=Math.floor(sy+dy*t);
     if((cx===x&&cy===y)||(cx===c.x&&cy===c.y))continue;
     const o=objs[ck(cx,cy)];if(o&&OPQ[o.t]){ok=false;break}
    }
   }
   if(ok){const L=Math.pow(1-d/(vr+.5),.8),k=ck(x,y);if(L>(m[k]||0))m[k]=L}
  }
 }
 return m;
}
function moveCam(f,s){const st=0.35;ox+=(-sn*f+cs*s)*st;oy+=(-cs*f-sn*s)*st;draw()}
addEventListener('keydown',e=>{
 if(e.target.tagName==='INPUT')return;
 const k=e.key;
 if(k==='q'||k==='Q')setAng(ang-Math.PI/2);
 if(k==='e'||k==='E')setAng(ang+Math.PI/2);
 if(k==='w'||k==='W'||k==='ArrowUp'){moveCam(1,0);e.preventDefault()}
 if(k==='s'||k==='S'||k==='ArrowDown'){moveCam(-1,0);e.preventDefault()}
 if(k==='a'||k==='A'||k==='ArrowLeft'){moveCam(0,-1);e.preventDefault()}
 if(k==='d'||k==='D'||k==='ArrowRight'){moveCam(0,1);e.preventDefault()}
});
[['cmF',1,0],['cmB',-1,0],['cmL',0,-1],['cmR',0,1]].forEach(([id,f,s])=>{
 const b=document.getElementById(id);let t=null;
 const stop=()=>{clearInterval(t);t=null};
 b.onpointerdown=e=>{e.preventDefault();stop();moveCam(f,s);t=setInterval(()=>moveCam(f,s),40)};
 b.onpointerup=b.onpointerleave=b.onpointercancel=stop;
});
const COLS=['#3b7dd8','#d8453b','#3bb36b','#d8a83b','#9b4fd0','#3bc3c3'];
function freeSpot(){
 for(const k of chunks){const[cx,cy]=k.split(',').map(Number);
  for(let j=0;j<C;j++)for(let i=0;i<C;i++){const x=cx*C+i,y=cy*C+j;if(freeAt(x,y))return[x,y]}}
 return null;
}
document.getElementById('addc').onclick=()=>{
 const s=freeSpot();if(!s){flash('Нет свободных клеток');return}
 const c={id:Date.now()+Math.random(),x:s[0],y:s[1],name:document.getElementById('nm').value.trim()||('Герой '+(chars.length+1)),col:document.getElementById('cl').value};
 chars.push(c);sel=c.id;document.getElementById('nm').value='';
 document.getElementById('cl').value=COLS[chars.length%COLS.length];
 save();draw();flash('Персонаж добавлен и выбран — нажмите «🖼 Картинка», чтобы задать изображение');
};
const fi=document.getElementById('fi');
document.getElementById('img').onclick=()=>{if(!chars.find(c=>c.id===sel)){flash('Сначала выберите персонажа (✋ и клик по нему) или перетащите картинку прямо на него');return}fi.click()};
fi.onchange=()=>{const c=chars.find(c=>c.id===sel);if(c&&fi.files[0])loadImg(c,fi.files[0]);fi.value=''};
document.getElementById('noimg').onclick=()=>{const c=chars.find(c=>c.id===sel);if(c){delete c.img;delete imgs[c.id];save();draw()}};
document.getElementById('clr').onclick=()=>{ter={};objs={};chars=[];chunks=new Set();imgs={};sel=null;start();save()};
function setImg(c){const im=new Image();im.onload=draw;im.src=c.img;imgs[c.id]=im}
function loadImg(c,file){
 const r=new FileReader();
 r.onload=()=>{const im=new Image();im.onload=()=>{
  const s=Math.min(im.width,im.height),k=document.createElement('canvas');k.width=k.height=128;
  k.getContext('2d').drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,128,128);
  c.img=k.toDataURL('image/webp',.85);setImg(c);save()};im.src=r.result};
 r.readAsDataURL(file);
}

// ---------- generation ----------
const LIQ={water:1,lava:1};
const freeAt=(x,y)=>{const k=ck(x,y);return ter[k]&&!objs[k]&&!LIQ[ter[k]]&&!chars.some(c=>c.x===x&&c.y===y)};
function dens(t,cx,cy){
 let n=0,m=0;
 [[1,0],[-1,0],[0,1],[0,-1]].forEach(([a,b])=>{
  if(!chunks.has(ck(cx+a,cy+b)))return;m++;
  for(let j=0;j<C;j++)for(let i=0;i<C;i++){const o=objs[ck((cx+a)*C+i,(cy+b)*C+j)];if(o&&(o.t===t||(t==='wall'&&o.t==='door')))n++}
 });
 return m?n/(m*C*C):0;
}
function gen(cx,cy,op){op=op||{};const on=k=>op[k]!==false;
 const GR={tg:['grass','tall','field','plow'],te:['dirt','sand'],ts:['stone','snow','wood'],tw:['water'],tl:['lava']};
 const A={};for(const k in GR)if(on(k))GR[k].forEach(q=>A[q]=1);
 if(!Object.keys(A).length)Object.keys(TER).forEach(q=>A[q]=1);
 const Aarr=Object.keys(A);
 chunks.add(ck(cx,cy));
 const x0=cx*C,y0=cy*C,inC=(x,y)=>x>=x0&&x<x0+C&&y>=y0&&y<y0+C;
 let left=[];for(let j=0;j<C;j++)for(let i=0;i<C;i++)left.push([x0+i,y0+j]);
 left.sort(()=>rnd()-.5);
 let has=false;
 for(let j=-1;j<=C;j++)for(let i=-1;i<=C;i++)if(ter[ck(x0+i,y0+j)])has=true;
 if(!has)for(let s=0;s<4;s++){const[x,y]=left[s];const pl0=['grass','grass','tall','dirt','sand','stone','field','water'].filter(q=>A[q]);ter[ck(x,y)]=pick(pl0.length?pl0:Aarr)}
 left=left.filter(([x,y])=>!ter[ck(x,y)]);
 while(left.length){
  const next=[];let did=0;
  for(const[x,y]of left){
   const ns=[];
   for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const t=ter[ck(x+dx,y+dy)];if(t)ns.push(t)}
   if(!ns.length){next.push([x,y]);continue}
   let t=pick(ns);
   if(rnd()<.1){const m=COMP[t].filter(q=>A[q]);if(m.length)t=pick(m)}
   if(!A[t]){
    const dd=Math.min(x-x0,x0+C-1-x,y-y0,y0+C-1-y);
    if(rnd()>[.7,.3,.08,.02][Math.min(dd,3)]){const m=COMP[t].filter(q=>A[q]);t=pick(m.length?m:Aarr)}
   }
   ter[ck(x,y)]=t;did++;
  }
  left=next;
  if(!did&&left.length)ter[ck(left[0][0],left[0][1])]=pick(Aarr);
 }
 // берега у воды и лавы
 const SH={water:'sand',lava:'stone'};
 for(let j=0;j<C;j++)for(let i=0;i<C;i++){
  const x=x0+i,y=y0+j;if(LIQ[ter[ck(x,y)]])continue;
  for(const[a,b]of[[1,0],[-1,0],[0,1],[0,-1]]){const n=ter[ck(x+a,y+b)];if(LIQ[n]&&rnd()<.55){ter[ck(x,y)]=SH[n];break}}
 }
 // продолжение стен и колонн из соседних областей
 const edges=[];
 for(let i=0;i<C;i++){
  edges.push([x0,y0+i,x0-1,y0+i,1,0],[x0+C-1,y0+i,x0+C,y0+i,-1,0],[x0+i,y0,x0+i,y0-1,0,1],[x0+i,y0+C-1,x0+i,y0+C,0,-1]);
 }
 for(const[x,y,ox2,oy2,dx,dy]of edges){
  const o=objs[ck(ox2,oy2)];if(!o)continue;
  if((o.t==='wall'||o.t==='door')&&on('ruin')&&rnd()<.75){
   const len=1+rnd()*4|0;
   for(let k=0;k<len;k++){const X=x+dx*k,Y=y+dy*k;if(inC(X,Y)&&freeAt(X,Y))objs[ck(X,Y)]={t:'wall',r:0};else break}
  }else if(o.t==='column'&&on('column')&&rnd()<.8){
   for(const k of[0,2]){const X=x+dx*k,Y=y+dy*k;if(inC(X,Y)&&freeAt(X,Y))objs[ck(X,Y)]={t:'column',r:0}}
  }
 }
 // комнаты-руины
 for(let a=0;a<2;a++){
  if(!on('ruin')||(a>0&&rnd()>.3+Math.min(.5,dens('wall',cx,cy)*5)))continue;
  let w,h,i,j,ok=false;
  for(let tr=0;tr<60&&!ok;tr++){
   w=3+rnd()*3|0;h=3+rnd()*3|0;i=rnd()*(C-w+1)|0;j=rnd()*(C-h+1)|0;
   ok=true;
   for(let y=0;y<h;y++)for(let x=0;x<w;x++)if(!freeAt(x0+i+x,y0+j+y))ok=false;
  }
  if(!ok){
   if(a>0)continue;
   w=4;h=4;i=rnd()*(C-3)|0;j=rnd()*(C-3)|0;
   for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const X=x0+i+x,Y=y0+j+y;
    if(!chars.some(c=>c.x===X&&c.y===Y)){delete objs[ck(X,Y)];if(LIQ[ter[ck(X,Y)]])ter[ck(X,Y)]='stone'}
   }
  }
  
  
  
  const fl=pick(['stone','wood']);
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
   const X=x0+i+x,Y=y0+j+y;
   if(x===0||y===0||x===w-1||y===h-1)objs[ck(X,Y)]={t:'wall',r:0};else ter[ck(X,Y)]=fl;
  }
  const s=rnd()*4|0;let dx,dy;
  if(s<2){dx=1+rnd()*(w-2)|0;dy=s?h-1:0}else{dy=1+rnd()*(h-2)|0;dx=s===2?0:w-1}
  objs[ck(x0+i+dx,y0+j+dy)]={t:'door',r:s<2?0:1};
  const ix=x0+i+1+(rnd()*(w-2)|0),iy=y0+j+1+(rnd()*(h-2)|0);
  if(!on('chest')){}else if(rnd()<.6)objs[ck(ix,iy)]={t:'chest',r:0};
  else if(rnd()<.5)objs[ck(ix,iy)]={t:'barrel',r:0};
 }
 // колоннада
 if(rnd()<.3){
  const hz=rnd()<.5,n=4+rnd()*3|0,sx=x0+(rnd()*C|0),sy=y0+(rnd()*C|0);
  for(let k=0;k<(on('column')?n:0);k++){const X=sx+(hz?k*2:0),Y=sy+(hz?0:k*2);if(inC(X,Y)&&freeAt(X,Y))objs[ck(X,Y)]={t:'column',r:0}}
 }
 // россыпь по почве и по соседям
 const rules=[['tree','grass tall snow',.04,.8,'tree'],['rock','dirt stone sand snow grass',.015,.5,'rock'],['column','stone dirt sand',.008,.5,'column'],['chest','grass dirt stone sand wood snow',.004,.3,'chest'],['barrel','dirt stone wood sand',.006,.4,'chest']];
 const dn={};rules.forEach(r=>dn[r[0]]=dens(r[0],cx,cy));
 for(let j=0;j<C;j++)for(let i=0;i<C;i++){
  const x=x0+i,y=y0+j;if(!freeAt(x,y))continue;
  const t=ter[ck(x,y)];
  for(const r of rules){
   if(!on(r[4])||!r[1].split(' ').includes(t))continue;
   if(rnd()<Math.min(.4,r[2]+dn[r[0]]*r[3])){objs[ck(x,y)]={t:r[0],r:0};break}
  }
 }
}
function start(){
 gen(0,0);gen(1,0);gen(0,1);gen(1,1);
 [['Воин','#3b7dd8'],['Маг','#9b4fd0']].forEach((p,i)=>{const s=freeSpot();if(s)chars.push({id:i+1,x:s[0],y:s[1],name:p[0],col:p[1]})});
 fit();draw();
}
function fit(){
 let a=1e9,b=1e9,c=-1e9,d=-1e9;
 chunks.forEach(k=>{const[x,y]=k.split(',').map(Number);a=Math.min(a,x);b=Math.min(b,y);c=Math.max(c,x);d=Math.max(d,y)});
 ox=(a+c+1)*C/2;oy=(b+d+1)*C/2;ext=Math.max(c-a+1,d-b+1)*C+C*1.3;panX=panY=0;
}
function plusList(){
 const out=[],seen=new Set();
 chunks.forEach(k=>{const[cx,cy]=k.split(',').map(Number);
  [[1,0],[-1,0],[0,1],[0,-1]].forEach(([a,b])=>{const nk=ck(cx+a,cy+b);if(!chunks.has(nk)&&!seen.has(nk)){seen.add(nk);out.push([cx+a,cy+b])}})});
 return out;
}

// ---------- флажки у плюсиков ----------
const CHK=[['tg','🌿','Трава и поля'],['te','🏜','Земля и песок'],['ts','⛰','Камень, снег, дерево'],['tw','💧','Вода'],['tl','🔥','Лава'],['tree','🌲','Деревья'],['rock','🪨','Камни'],['ruin','🏚','Руины и стены'],['column','🏛','Колонны'],['chest','📦','Сундуки и бочки']];
const popts={};
const getOpts=pl=>popts[ck(pl[0],pl[1])]||{};
function chkLayout(cx,cy){
 const p=P(cx*C+C/2,cy*C+C/2,0),r=S*0.7,s=Math.max(12,S*0.34),cw=s*2.7,rh=s*1.5,x0=p[0]-cw,y0=p[1]+r+s*0.4;
 return CHK.map((c,i)=>({k:c[0],e:c[1],n:c[2],x:x0+(i%2)*cw,y:y0+(i/2|0)*rh,w:cw,h:rh,s}));
}
function drawChk(cx,cy){
 const o=popts[ck(cx,cy)]||{};
 chkLayout(cx,cy).forEach(b=>{
  const on=o[b.k]!==false;
  g.fillStyle='rgba(30,26,20,.88)';g.fillRect(b.x,b.y,b.w-2,b.h-2);
  const q=b.s*0.8,qx=b.x+4,qy=b.y+(b.h-2-q)/2;
  g.fillStyle=on?'#e0583a':'rgba(255,255,255,.12)';g.fillRect(qx,qy,q,q);g.strokeStyle='#fff';g.lineWidth=1.5;g.strokeRect(qx,qy,q,q);
  if(on){g.beginPath();g.moveTo(qx+q*.2,qy+q*.52);g.lineTo(qx+q*.42,qy+q*.75);g.lineTo(qx+q*.8,qy+q*.25);g.stroke()}
  g.font=`${b.s}px system-ui,sans-serif`;g.textAlign='left';g.textBaseline='middle';g.fillStyle='#fff';g.fillText(b.e,qx+q+4,b.y+(b.h-2)/2+1);g.textBaseline='alphabetic';
 });
}
function chkAt(e){
 const r=cv.getBoundingClientRect(),X=e.clientX-r.left,Y=e.clientY-r.top;
 for(const[cx,cy]of plusList())for(const b of chkLayout(cx,cy))if(X>=b.x&&X<b.x+b.w&&Y>=b.y&&Y<b.y+b.h)return{cx,cy,b};
 return null;
}

// ---------- geometry ----------
function view(){
 sn=Math.sin(ang);cs=Math.cos(ang);T=Math.sin(tilt);Hc=Math.cos(tilt);
 S=Math.min(W/(ext*1.45),H/(ext*1.45*T+2.2))*zoom;
}
function P(x,y,z){
 const dx=x-ox,dy=y-oy,rx=dx*cs-dy*sn,ry=dx*sn+dy*cs;
 return [W/2+panX+rx*S, H*0.56+panY+ry*S*T-(z||0)*S*Hc];
}
function unP(X,Y){
 const rx=(X-W/2-panX)/S, ry=(Y-H*0.56-panY)/(S*T);
 return [rx*cs+ry*sn+ox, -rx*sn+ry*cs+oy];
}
let lt=1,wm=0,LM=null;
const sh=(c,f)=>{const k=f*lt,bl=1+(1-lt)*0.35;return `rgb(${[c[0]*k*(1+wm*.22),c[1]*k*(1+wm*.07),c[2]*k*bl*(1-wm*.22)].map(v=>Math.max(0,Math.min(255,v))|0)})`};
function setLight(x,y){if(!LM){lt=1;wm=0;return}const L=LM[ck(x,y)]||0;lt=.14+.86*L;wm=L}
function poly(pts,fill,stroke){
 g.beginPath();pts.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));g.closePath();
 if(fill){g.fillStyle=fill;g.fill()} if(stroke){g.strokeStyle=stroke;g.lineWidth=1;g.stroke()}
}
function prism(pts,z0,z1,col,topF){
 const n=pts.length,c0=pts.reduce((a,p)=>[a[0]+p[0]/n,a[1]+p[1]/n],[0,0]);
 for(let i=0;i<n;i++){
  const a=pts[i],b=pts[(i+1)%n],mx=(a[0]+b[0])/2-c0[0],my=(a[1]+b[1])/2-c0[1];
  if(mx*sn+my*cs<=0.001)continue;
  const l=Math.hypot(mx,my)||1,f=0.58+0.42*(0.5-0.5*(mx*cs-my*sn)/l);
  poly([P(a[0],a[1],z0),P(b[0],b[1],z0),P(b[0],b[1],z1),P(a[0],a[1],z1)],sh(col,f));
 }
 poly(pts.map(p=>P(p[0],p[1],z1)),sh(col,topF||1.18));
}
function boxPts(x,y,w,d){return [[x-w/2,y-d/2],[x+w/2,y-d/2],[x+w/2,y+d/2],[x-w/2,y+d/2]]}
function circ(x,y,r,k){k=k||12;return Array.from({length:k},(_,i)=>[x+Math.cos(i/k*6.2832)*r,y+Math.sin(i/k*6.2832)*r])}

// ---------- drawing ----------
const hs=(x,y)=>((x*73856093)^(y*19349663))>>>0;
function tile(x,y){setLight(x,y);
 const t=TER[ter[ck(x,y)]],q=[P(x,y,0),P(x+1,y,0),P(x+1,y+1,0),P(x,y+1,0)];
 poly(q,sh(t.c,0.94+((hs(x,y)&7)/7)*0.12));
 const h=hs(x,y);g.fillStyle=g.strokeStyle=sh(t.d,1);g.lineWidth=Math.max(1,S*0.04);
 if(t.t==='dots'||t.t==='blades'){
  for(let k=0;k<5;k++){const u=((h>>(k*5))&31)/32*0.8+0.1,w=((h>>(k*3+2))&31)/32*0.8+0.1,p=P(x+u,y+w,0);
   if(t.t==='dots')g.fillRect(p[0],p[1],S*0.07,S*0.05);
   else{const a=P(x+u,y+w,0.28);g.beginPath();g.moveTo(p[0],p[1]);g.lineTo(a[0],a[1]);g.stroke()}}
 }else if(t.t==='rows'||t.t==='planks'){
  const n=t.t==='rows'?5:4;
  for(let i=1;i<n;i++){const a=P(x+0.05,y+i/n,0),b=P(x+0.95,y+i/n,0);g.beginPath();g.moveTo(a[0],a[1]);g.lineTo(b[0],b[1]);g.stroke()}
 }else if(t.t==='tiles')poly(q,null,sh(t.d,1));
 else if(t.t==='waves'){
  for(let k=0;k<2;k++){const u=((h>>(k*6))&15)/16*0.5+0.15,w=0.3+k*0.4,a=P(x+u,y+w,0),b=P(x+u+0.3,y+w,0);g.beginPath();g.moveTo(a[0],a[1]);g.lineTo(b[0],b[1]);g.stroke()}
 }
}
function ent(o,x,y){setLight(x,y);
 const cx=x+0.5,cy=y+0.5,r=o.r;
 const B=(ox2,oy2,w,d,h,z0,col,tf)=>{const a=r?oy2:ox2,b=r?ox2:oy2;prism(boxPts(cx+a,cy+b,r?d:w,r?w:d),z0,z0+h,col,tf)};
 if(o.t==='wall')prism(boxPts(cx,cy,0.98,0.98),0,1.6,[132,126,118]);
 else if(o.t==='column'){prism(circ(cx,cy,0.4),0,0.18,[206,200,188]);prism(circ(cx,cy,0.29),0.18,1.6,[214,208,196]);prism(circ(cx,cy,0.4),1.6,1.8,[206,200,188])}
 else if(o.t==='chest'){B(0,0,0.64,0.42,0.3,0,[118,70,30]);B(0,0,0.66,0.44,0.14,0.3,[146,92,42],1.1);B(0,0,0.1,0.46,0.46,0,[210,168,52])}
 else if(o.t==='door'){
  B(-0.43,0,0.14,0.34,1.75,0,[130,126,118]);B(0.43,0,0.14,0.34,1.75,0,[130,126,118]);
  B(0,0,1,0.34,0.15,1.6,[130,126,118]);B(0,0,0.72,0.16,1.6,0,[126,80,40],1.08);B(0.22,0,0.08,0.2,0.1,0.8,[220,180,60]);
 }else if(o.t==='tree'){
  const v=0.9+((hs(x,y)&7)/7)*0.2;
  prism(circ(cx,cy,0.1,8),0,0.6,[100,68,36]);prism(circ(cx,cy,0.42,10),0.5,1.0,[52*v,112*v,48*v]);
  prism(circ(cx,cy,0.3,10),1.0,1.5,[60*v,128*v,54*v]);prism(circ(cx,cy,0.16,8),1.5,1.9,[70*v,140*v,60*v]);
 }else if(o.t==='rock'){
  prism(circ(cx+0.04,cy,0.4,7),0,0.35,[120,118,112]);prism(circ(cx-0.1,cy+0.08,0.24,6),0.35,0.6,[136,134,128]);
 }else if(o.t==='barrel'){
  prism(circ(cx,cy,0.3,10),0,0.65,[126,82,40]);prism(circ(cx,cy,0.31,10),0.28,0.36,[70,50,30]);
 }
}
function drawChar(c){lt=1;wm=0;
 const cx=c.x+0.5,cy=c.y+0.5,col=c.col.match(/\w\w/g).map(h=>parseInt(h,16)),im=imgs[c.id];
 if(sel===c.id){const p=P(cx,cy,0);g.strokeStyle='#ffd34d';g.lineWidth=3;g.beginPath();g.ellipse(p[0],p[1],S*0.46,S*0.46*T,0,0,6.2832);g.stroke()}
 prism(circ(cx,cy,0.3),0,0.12,[50,50,56]);
 let lx,ly;
 if(im&&im.complete&&im.naturalWidth){
  const p=P(cx,cy,0.8),r=S*0.42;lx=p[0];ly=p[1]-r-4;
  g.save();g.beginPath();g.arc(p[0],p[1],r,0,6.2832);g.clip();g.drawImage(im,p[0]-r,p[1]-r,r*2,r*2);g.restore();
  g.beginPath();g.arc(p[0],p[1],r,0,6.2832);g.lineWidth=3;g.strokeStyle=c.col;g.stroke();
 }else{
  prism(circ(cx,cy,0.2),0.12,0.8,col);
  const h=P(cx,cy,0.98);g.beginPath();g.arc(h[0],h[1],S*0.17,0,6.2832);g.fillStyle=sh(col,1.25);g.fill();g.strokeStyle='rgba(0,0,0,.45)';g.lineWidth=1;g.stroke();
  lx=h[0];ly=h[1]-S*0.26;
 }
 g.font=`600 ${Math.max(10,S*0.3)|0}px system-ui,sans-serif`;g.textAlign='center';g.lineWidth=3;g.strokeStyle='rgba(0,0,0,.75)';g.strokeText(c.name,lx,ly);g.fillStyle='#fff';g.fillText(c.name,lx,ly);
}
function draw(){
 if(!W)return;
 const d=devicePixelRatio||1;g.setTransform(1,0,0,1,0,0);g.clearRect(0,0,cv.width,cv.height);g.setTransform(d,0,0,d,0,0);
 view();
 LM=(vision&&chars.length)?lightMap():null;const cl=[];
 chunks.forEach(k=>{const[cx,cy]=k.split(',').map(Number);cl.push([cx,cy]);
  for(let j=0;j<C;j++)for(let i=0;i<C;i++)tile(cx*C+i,cy*C+j)});
 cl.forEach(([cx,cy])=>poly([P(cx*C,cy*C,0),P(cx*C+C,cy*C,0),P(cx*C+C,cy*C+C,0),P(cx*C,cy*C+C,0)],null,'rgba(0,0,0,.35)'));
 if(hover){const[x,y]=hover;poly([P(x,y,0),P(x+1,y,0),P(x+1,y+1,0),P(x,y+1,0)],'rgba(255,255,255,.22)','rgba(255,255,255,.9)')}
 const L=[];
 for(const k in objs){const[x,y]=k.split(',').map(Number);L.push({d:(x+.5-ox)*sn+(y+.5-oy)*cs,f:()=>ent(objs[k],x,y)})}
 chars.forEach(c=>L.push({d:(c.x+.5-ox)*sn+(c.y+.5-oy)*cs+0.01,f:()=>drawChar(c)}));
 L.sort((a,b)=>a.d-b.d).forEach(e=>e.f());
 lt=1;wm=0;
 steam.forEach(p=>{const t=p.a/p.m,q=P(p.x,p.y,p.z);g.beginPath();g.arc(q[0],q[1],S*(p.r+0.28*t),0,6.2832);g.fillStyle=`rgba(238,242,247,${(0.4*(1-t)).toFixed(3)})`;g.fill()});
 plusList().forEach(([cx,cy])=>{
  const hv=hoverPlus&&hoverPlus[0]===cx&&hoverPlus[1]===cy;
  poly([P(cx*C,cy*C,0),P(cx*C+C,cy*C,0),P(cx*C+C,cy*C+C,0),P(cx*C,cy*C+C,0)],hv?'rgba(255,255,255,.16)':'rgba(255,255,255,.06)','rgba(255,255,255,.35)');
  const p=P(cx*C+C/2,cy*C+C/2,0),r=S*0.7;
  g.beginPath();g.arc(p[0],p[1],r,0,6.2832);g.fillStyle=hv?'#e0583a':'rgba(30,26,20,.85)';g.fill();g.lineWidth=2;g.strokeStyle='#fff';g.stroke();
  g.beginPath();g.moveTo(p[0]-r*.5,p[1]);g.lineTo(p[0]+r*.5,p[1]);g.moveTo(p[0],p[1]-r*.5);g.lineTo(p[0],p[1]+r*.5);g.lineWidth=Math.max(2,S*0.12);g.stroke();
  drawChk(cx,cy);
 });
}

// ---------- interaction ----------
let drag=null,last=null;
function cellAt(e){
 const r=cv.getBoundingClientRect(),[gx,gy]=unP(e.clientX-r.left,e.clientY-r.top),x=Math.floor(gx),y=Math.floor(gy);
 return chunks.has(ck(Math.floor(x/C),Math.floor(y/C)))?[x,y]:null;
}
function plusAt(e){
 const r=cv.getBoundingClientRect(),X=e.clientX-r.left,Y=e.clientY-r.top;
 return plusList().find(([cx,cy])=>{const p=P(cx*C+C/2,cy*C+C/2,0);return Math.hypot(p[0]-X,p[1]-Y)<S*0.8})||null;
}
function apply(x,y){
 const k=ck(x,y);
 if(tool==='paint'&&terr)ter[k]=terr;
 else if(PLACE.includes(tool)){
  const o=objs[k];if(o&&o.t===tool&&drag.fresh)o.r=o.r?0:1;else if(!o||o.t!==tool)objs[k]={t:tool,r:0};
 }else if(tool==='erase'){
  if(objs[k])delete objs[k];else chars=chars.filter(c=>!(c.x===x&&c.y===y));
 }
}
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('pointerdown',e=>{
 cv.setPointerCapture(e.pointerId);
 if(e.button===1||e.altKey){drag={mode:'pan',x:e.clientX,y:e.clientY,px:panX,py:panY};e.preventDefault();return}
 if(e.button===2||e.shiftKey||tool==='cam'){drag={mode:'rot',x:e.clientX,a:ang};return}
 const ch=chkAt(e);
 if(ch){const k=ck(ch.cx,ch.cy),o=popts[k]||(popts[k]={});o[ch.b.k]=o[ch.b.k]===false;drag=null;draw();return}
 const pl=plusAt(e);
 if(pl){gen(pl[0],pl[1],getOpts(pl));fit();save();drag=null;draw();return}
 const c=cellAt(e);if(!c){drag=null;return}
 drag={mode:'tool',fresh:true,char:null};
 if(tool==='move'){
  const ch=chars.find(q=>q.x===c[0]&&q.y===c[1]);sel=ch?ch.id:null;drag.char=ch||null;
  const o=objs[ck(c[0],c[1])];if(!ch&&o&&(o.t==='door'||o.t==='chest'))o.r=o.r?0:1;
 }else apply(c[0],c[1]);
 last=c.join();drag.fresh=false;draw();
});
cv.addEventListener('pointermove',e=>{
 if(drag&&drag.mode==='rot'){setAng(drag.a+(e.clientX-drag.x)*0.01);return}
 if(drag&&drag.mode==='pan'){panX=drag.px+e.clientX-drag.x;panY=drag.py+e.clientY-drag.y;draw();return}
 const chh=chkAt(e);
 if(chh){hint.textContent='☑ '+chh.b.n+' — включить/выключить для нового блока';hint.dataset.c=1}else if(hint.dataset.c){hint.textContent=HINT;delete hint.dataset.c}
 const c=cellAt(e);hover=c;hoverPlus=chh?null:plusAt(e);
 if(drag&&c&&c.join()!==last){
  last=c.join();
  if(tool==='move'){
   const o=objs[ck(c[0],c[1])];
   if(drag.char&&(!o||o.t==='door')&&!chars.some(q=>q!==drag.char&&q.x===c[0]&&q.y===c[1])){drag.char.x=c[0];drag.char.y=c[1]}
  }else apply(c[0],c[1]);
 }
 cv.style.cursor=(hoverPlus||chh)?'pointer':'default';
 draw();
});
cv.addEventListener('pointerup',()=>{if(drag&&drag.mode==='tool')save();drag=null;last=null});
cv.addEventListener('pointerleave',()=>{hover=null;hoverPlus=null;draw()});
cv.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(0.3,Math.min(4,zoom*(e.deltaY<0?1.1:0.9)));draw()},{passive:false});
cv.addEventListener('dragover',e=>e.preventDefault());
cv.addEventListener('drop',e=>{
 e.preventDefault();const f=e.dataTransfer.files[0];if(!f||!f.type.startsWith('image/'))return;
 const c=cellAt(e),ch=c&&chars.find(q=>q.x===c[0]&&q.y===c[1])||chars.find(q=>q.id===sel);
 if(ch){sel=ch.id;loadImg(ch,f)}else flash('Бросьте картинку на персонажа');
});

// ---------- storage ----------
function save(){try{localStorage.setItem('dnd-arena2',JSON.stringify({ter,objs,chars,chunks:[...chunks]}))}catch(e){}}
function load(){
 try{const s=JSON.parse(localStorage.getItem('dnd-arena2')||'null');
  if(s&&s.chunks&&s.chunks.length){ter=s.ter;objs=s.objs||{};chars=s.chars||[];chunks=new Set(s.chunks);chars.forEach(c=>c.img&&setImg(c));fit();return}}catch(e){}
 start();
}
function resize(){const r=cv.getBoundingClientRect(),d=devicePixelRatio||1;W=r.width;H=r.height;cv.width=W*d;cv.height=H*d;draw()}
addEventListener('resize',resize);
// ---------- пар на границе лавы и воды ----------
let srcs=[],steam=[],lastT=0,frame=0;
function steamSrc(){
 const out=[];
 for(const k in ter){
  if(ter[k]!=='lava')continue;
  const[x,y]=k.split(',').map(Number);
  for(const[a,b]of[[1,0],[-1,0],[0,1],[0,-1]])if(ter[ck(x+a,y+b)]==='water')out.push([x+.5+a*.5,y+.5+b*.5]);
 }
 return out;
}
function tick(t){
 requestAnimationFrame(tick);
 if(t-lastT<40)return;lastT=t;
 if(frame++%25===0)srcs=steamSrc();
 if(!srcs.length&&!steam.length)return;
 if(steam.length<500)srcs.forEach(s=>{if(rnd()<.22)steam.push({x:s[0]+(rnd()-.5)*.5,y:s[1]+(rnd()-.5)*.5,z:.05,vx:(rnd()-.5)*.012,vy:(rnd()-.5)*.012,vz:.02+rnd()*.02,a:0,m:35+rnd()*25,r:.14+rnd()*.1})});
 steam.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.z+=p.vz;p.a++});
 steam=steam.filter(p=>p.a<p.m);
 draw();
}
requestAnimationFrame(tick);
load();ui();resize();
</script>
